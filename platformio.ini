[platformio]
# Allows PlatformIO to compile .ino and header files directly from this directory
src_dir = .
include_dir = .

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

# Serial Monitor Settings
monitor_speed = 115200

# Library Dependencies
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.0
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.10

# Board alternatives (uncomment if you are using a different ESP8266 board):
# board = d1_mini
# board = esp12e

# --- WIRELESS OTA FLASHING ---
# To flash wirelessly over WiFi instead of USB, uncomment the two lines below:
# upload_protocol = espota
# upload_port = holonet-display.local


